name: Deploy Node.js App to EC2

on:
  push:
    branches:
      - main
      - qa  # Added QA branch trigger

  workflow_dispatch:

env:
  AWS_REGION: eu-north-1a
  ECR_REPOSITORY: ecr-demo-docker

jobs:
  # ==========================================
  # DEV DEPLOYMENT (Runs only on 'main' branch)
  # ==========================================
  deploy-dev:
    name: Deploy to Dev
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest-dev" \
            .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest-dev"

      - - name: Deploy to Dev EC2
  uses: appleboy/ssh-action@v1.2.0
  with:
    host: ${{ secrets.DEV_EC2_HOST }}
    username: ${{ secrets.DEV_EC2_USERNAME }}
    key: ${{ secrets.DEV_EC2_SSH_KEY }}
    port: 22  # Explicitly set if using non-standard port
    envs: ECR_REGISTRY,ECR_REPOSITORY,IMAGE_TAG,AWS_REGION
    script: |
      set -e
      aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
      docker pull "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
      docker stop node-app-dev || true
      docker rm node-app-dev || true
      docker run -d \
        --name node-app-dev \
        --restart unless-stopped \
        -p 3000:3000 \
        -e ENV=DEV \
        "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

  # ==========================================
  # QA DEPLOYMENT (Runs only on 'qa' branch)
  # ==========================================
  deploy-qa:
    name: Deploy to QA
    if: github.ref == 'refs/heads/qa'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest-qa" \
            .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest-qa"

      - name: Deploy to QA EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
          AWS_REGION: ${{ env.AWS_REGION }}
        with:
          host: ${{ secrets.QA_EC2_HOST }}       # Ensure this secret is set
          username: ${{ secrets.QA_EC2_USERNAME }}
          key: ${{ secrets.QA_EC2_SSH_KEY }}
          envs: ECR_REGISTRY,ECR_REPOSITORY,IMAGE_TAG,AWS_REGION
          script: |
            set -e
            aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
            docker pull "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
            docker stop node-app-qa || true
            docker rm node-app-qa || true
            docker run -d \
              --name node-app-qa \
              --restart unless-stopped \
              -p 3000:3000 \
              -e ENV=QA \
              "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
